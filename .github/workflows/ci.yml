name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dan nyalakan stack
        run: docker compose up -d --build --wait

      - name: Run tests
        run: npm test

      # Proyek individu (Toko Kue): stack Compose sendiri, test lab 12 dipakai kembali
      - name: Build dan nyalakan stack Toko Kue
        run: docker compose -f docker-compose.kue.yml up -d --build --wait

      - name: Run project tests (Toko Kue)
        run: npm run test:kue

      - name: Tampilkan log
        if: always()
        run: |
          docker compose logs
          docker compose -f docker-compose.kue.yml logs

      - name: Matikan stack
        if: always()
        run: |
          docker compose down -v
          docker compose -f docker-compose.kue.yml down -v
